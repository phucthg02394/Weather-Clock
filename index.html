<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thông tin thời tiết ngay trên trình duyệt">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <title>Weather Clock</title>
</head>
<body>
    <div class="container">
        <div class="location">
            <p id="city">Bạn đang ở nơi đồng không mông quạnh</p>
        </div>
        <div class="current">
            <p class="date">Thứ ba, ngày 22 tháng 09 năm 2026</p>
            <p class="time">20:17</p>
            <p class="weather">Hôm nay trời sao ai biết</p>
        </div>
        <div class="voice">
            <button id="speak-btn">
                <img src="./assets/audio-lines.svg" alt="Giọng nói">
            </button>
            <p>Bấm vào đây nếu mắt bạn không quá tốt</p>
        </div>

    </div>
    
    <script src="./script.js"></script>
</body>
</html>
